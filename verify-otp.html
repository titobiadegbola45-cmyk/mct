<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Dad's Travel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif
}

:root {
    --green-primary: #007A3D;   /* Main green */
    --green-dark: #005C2E;      /* Dark green for hover */
    --green-light: #E8F5E9;     /* Light green background */
    --white: #FFFFFF;
    --text-dark: #1A2E1A;
    --text-gray: #6B7280;
    --border: #D1E7DD;
}

body{
    background: var(--green-light); /* Light green bg */
    color: var(--text-dark);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center
}

.box{
    width:100%;
    max-width:400px;
    background: var(--white);
    padding: 30px 25px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,122,61,0.1);
}

h1{
    font-size:26px;
    margin-bottom:8px;
    color: var(--green-dark);
}

.subtitle{
    color: var(--text-gray);
    margin-bottom:25px;
    font-size:14px
}

.otp-inputs{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:20px
}

.otp-inputs input{
    width:50px;
    height:50px;
    text-align:center;
    font-size:20px;
    background: var(--white);
    border:1px solid var(--border);
    border-radius:10px;
    color: var(--text-dark);
    font-weight: 600;
}

.otp-inputs input:focus {
    border-color: var(--green-primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(0,122,61,0.1);
}

.btn{
    width:100%;
    padding:16px;
    background: var(--green-primary); /* Green button */
    border:none;
    border-radius:12px;
    color: var(--white); /* White text */
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:15px;
    transition: 0.3s;
}

.btn:active{
    background: var(--green-dark);
}

.resend{
    color: var(--text-gray);
    font-size:13px
}

.resend a{
    color: var(--green-primary);
    text-decoration:none;
    font-weight: 600;
} </style>
</head>
<body>
    <div class="box">
        <h1>Verify Email ✉️</h1>
        <p class="subtitle">We sent a 6-digit code to your email</p>

        <form id="otpForm">
            <div class="otp-inputs">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
                <input type="text" maxlength="1">
            </div>
            <button type="submit" class="btn">Verify</button>
        </form>

        <p class="resend">Didn't get code? <a href="#" onclick="alert('Code Resent!')">Resend</a></p>
    </div>

    <script>
        // Auto move to next OTP box
        const inputs = document.querySelectorAll('.otp-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if(input.value && index < inputs.length - 1){
                    inputs[index + 1].focus();
                }
            });
        });

        document.getElementById('otpForm').addEventListener('submit', function(e){
            e.preventDefault();
            let otp = '';
            inputs.forEach(input => otp += input.value);
            
            if(otp.length < 6){
                alert('Please enter all 6 digits');
                return;
            }
            alert('Email Verified! 🎉');
            window.location.href = 'login.html'; // After OTP go to login
        });
    </script>
</body>
</html>
